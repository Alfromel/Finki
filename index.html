<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Finki Stream — Premium</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
/* ======================================================================
   TOKENS — Diseño base compatible
   ====================================================================== */
:root{
  --primary:#E50914;
  --bg:#0a0a0f;
  --surface:#15151d;
  --surface-2:#1c1c26;
  --text:#f5f5f7;
  --text-dim:#a7a7b3;
  --text-faint:#6b6b78;
  --gold:#f2c14e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  min-height:100%;
  background:#000;
  color:var(--text);
  font-family:Arial, Helvetica, sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body{background:#000;}
img{-webkit-user-drag:none;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--primary);color:#fff;}

/* ======================================================================
   APLICACIÓN
   ====================================================================== */
.app{display:none;background:#000;}
.app.active{display:block;}

/* ======================================================================
   TV EXPERIENCE — Optimizado para navegadores antiguos
   ====================================================================== */
#appTV.active{
  display:block;
  width:100%;
  height:100vh;
  height:100dvh;
  position:relative;
  overflow:hidden;
}

.tv-body{
  display:flex;
  width:100%;
  height:100%;
  position:relative;
}

/* --- Barra lateral --- */
.tv-rail{
  width:80px;
  background:#0a0a0f;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 0;
  position:relative;
  z-index:50;
  border-right:1px solid #1a1a1a;
}

.tv-rail-logo{
  font-size:32px;
  font-weight:bold;
  color:var(--primary);
  margin-bottom:30px;
}

.tv-rail-item{
  display:flex;
  align-items:center;
  justify-content:center;
  width:60px;
  height:60px;
  border-radius:12px;
  color:#8a8a94;
  background:none;
  border:2px solid transparent;
  cursor:pointer;
  font-size:22px;
  margin-bottom:5px;
  transition:all 0.2s;
}

.tv-rail-item.active{
  color:#fff;
  background:rgba(229,9,20,0.2);
  border-color:var(--primary);
}

.tv-rail-item.tv-focused{
  color:#fff;
  border-color:var(--primary);
  background:rgba(229,9,20,0.3);
  transform:scale(1.1);
  box-shadow:0 0 15px rgba(229,9,20,0.5);
}

.tv-rail-avatar{
  margin-top:auto;
  width:50px;
  height:50px;
  border-radius:50%;
  background:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  color:#fff;
  font-size:20px;
  cursor:pointer;
  border:2px solid transparent;
}

.tv-rail-avatar.tv-focused{
  border-color:var(--primary);
  box-shadow:0 0 15px rgba(229,9,20,0.5);
  transform:scale(1.1);
}

/* --- Contenido --- */
.tv-content{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding-bottom:40px;
  background:var(--bg);
}

/* --- Hero --- */
.tv-hero{
  position:relative;
  height:70vh;
  min-height:450px;
  overflow:hidden;
  background:#000;
}

.tv-hero-slide{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  opacity:0;
  transition:opacity 1s;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.tv-hero-slide.active{opacity:1;}

.tv-hero-gradient{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:linear-gradient(to top, #000 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.7) 100%);
  z-index:1;
}

.tv-hero-content{
  position:absolute;
  bottom:15%;
  left:5%;
  max-width:600px;
  z-index:2;
}

.tv-hero-badge{
  display:inline-block;
  background:var(--primary);
  color:#fff;
  font-size:14px;
  font-weight:bold;
  padding:6px 16px;
  border-radius:20px;
  margin-bottom:15px;
  text-transform:uppercase;
}

.tv-hero-title{
  font-size:48px;
  font-weight:bold;
  margin-bottom:10px;
  text-shadow:2px 2px 8px rgba(0,0,0,0.9);
  line-height:1.1;
}

.tv-hero-meta{
  font-size:18px;
  color:#dcdce0;
  margin-bottom:25px;
}

.tv-hero-buttons{
  display:flex;
  gap:15px;
}

.tv-btn-hero{
  padding:15px 30px;
  border-radius:10px;
  font-weight:bold;
  font-size:18px;
  border:2px solid transparent;
  cursor:pointer;
  transition:all 0.2s;
  display:flex;
  align-items:center;
  gap:8px;
}

.tv-btn-play{
  background:#fff;
  color:#000;
}

.tv-btn-list{
  background:rgba(255,255,255,0.2);
  color:#fff;
  border-color:rgba(255,255,255,0.3);
}

.tv-btn-hero.tv-focused{
  transform:scale(1.1);
  border-color:var(--primary);
  box-shadow:0 0 15px rgba(229,9,20,0.5);
}

/* --- Filas de contenido --- */
.tv-row{
  margin-bottom:35px;
  padding-left:30px;
}

.tv-row-header{
  font-size:24px;
  font-weight:bold;
  margin-bottom:15px;
  color:#ececef;
}

.tv-slider{
  display:flex;
  gap:15px;
  overflow-x:hidden;
  padding-right:30px;
  padding-bottom:10px;
}

.tv-card{
  flex:0 0 auto;
  width:220px;
  border-radius:10px;
  overflow:hidden;
  position:relative;
  background:var(--surface);
  border:3px solid transparent;
  cursor:pointer;
  transition:all 0.3s;
}

.tv-card.tv-focused{
  transform:scale(1.15);
  z-index:20;
  border-color:var(--primary);
  box-shadow:0 10px 30px rgba(0,0,0,0.7), 0 0 15px rgba(229,9,20,0.5);
}

.tv-card-img-wrap{
  position:relative;
  width:100%;
  padding-bottom:150%;
  background:var(--surface-2);
  overflow:hidden;
}

.tv-card-img{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.tv-card-overlay{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:25px 10px 10px;
  background:linear-gradient(to top, rgba(0,0,0,0.9), transparent);
}

.tv-card-title{
  font-weight:bold;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.tv-card-meta{
  font-size:12px;
  color:#bbb;
  margin-top:2px;
}

.tv-card-badge{
  position:absolute;
  top:8px;
  left:8px;
  background:rgba(0,0,0,0.7);
  color:#fff;
  font-size:11px;
  font-weight:bold;
  padding:4px 8px;
  border-radius:5px;
  text-transform:uppercase;
  z-index:2;
}

.tv-card-badge.live{
  background:var(--primary);
}

/* --- Grid --- */
.tv-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:20px;
  padding:60px 30px 30px;
}

.tv-section-title{
  font-size:32px;
  font-weight:bold;
  margin-bottom:10px;
  grid-column:1/-1;
}

.tv-empty{
  color:var(--text-faint);
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  font-size:18px;
}

/* --- Búsqueda --- */
.tv-search-screen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#050508;
  z-index:200;
  display:none;
  padding:40px;
  overflow-y:auto;
}

.tv-search-screen.active{display:block;}

.tv-search-input-wrap{
  display:flex;
  align-items:center;
  background:rgba(255,255,255,0.1);
  border:2px solid transparent;
  border-radius:12px;
  padding:0 20px;
  max-width:600px;
  margin-bottom:20px;
}

.tv-search-input-wrap.tv-focused{
  border-color:var(--primary);
  box-shadow:0 0 15px rgba(229,9,20,0.5);
}

.tv-search-input-wrap input{
  flex:1;
  padding:15px 0;
  background:transparent;
  border:none;
  color:#fff;
  font-size:20px;
  outline:none;
}

.tv-filters{
  display:flex;
  gap:12px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

.tv-chip{
  padding:12px 30px;
  background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,255,255,0.15);
  border-radius:25px;
  color:#ddd;
  font-size:16px;
  cursor:pointer;
  font-weight:bold;
  transition:all 0.2s;
}

.tv-chip.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
}

.tv-chip.tv-focused{
  border-color:#fff;
  transform:scale(1.1);
  box-shadow:0 0 15px rgba(255,255,255,0.3);
}

.tv-search-results{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:18px;
}

/* --- Reproductor --- */
.tv-player-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  z-index:9999;
  display:none;
}

.tv-player-overlay.active{display:block;}

.tv-player-frame{
  width:100%;
  height:100%;
  border:none;
}

.tv-close-player{
  position:absolute;
  top:20px;
  right:20px;
  background:rgba(0,0,0,0.8);
  border:2px solid rgba(255,255,255,0.3);
  color:#fff;
  width:50px;
  height:50px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  z-index:10;
  cursor:pointer;
}

.tv-close-player.tv-focused{
  border-color:var(--primary);
  box-shadow:0 0 15px rgba(229,9,20,0.5);
}

/* --- Indicador de control remoto --- */
.tv-remote-hints{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:30px;
  padding:12px 20px;
  background:linear-gradient(to top, rgba(0,0,0,0.9), transparent);
  z-index:60;
  font-size:14px;
  color:#bbb;
}

.tv-key{
  display:inline-block;
  padding:4px 10px;
  border-radius:5px;
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.25);
  font-weight:bold;
  font-size:12px;
}

/* ======================================================================
   MOBILE EXPERIENCE — Versión simplificada
   ====================================================================== */
#appMobile.active{
  display:block;
  min-height:100vh;
  background:var(--bg);
}

.m-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:100;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(10,10,15,0.95);
}

.m-logo{
  font-size:24px;
  font-weight:bold;
  color:var(--primary);
}

.m-header-right{
  display:flex;
  gap:10px;
  align-items:center;
}

.m-icon-btn{
  width:36px;
  height:36px;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.15);
  color:#fff;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.m-avatar{
  width:36px;
  height:36px;
  border-radius:10px;
  background:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  cursor:pointer;
  border:2px solid rgba(255,255,255,0.2);
}

.m-content{
  padding-top:60px;
  padding-bottom:80px;
}

.m-hero{
  position:relative;
  height:55vh;
  min-height:350px;
  overflow:hidden;
}

.m-hero-slide{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  opacity:0;
  transition:opacity 1s;
  background-size:cover;
  background-position:center;
}

.m-hero-slide.active{opacity:1;}

.m-hero-gradient{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:linear-gradient(to top, #000 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.6) 100%);
  z-index:1;
}

.m-hero-content{
  position:absolute;
  bottom:10%;
  left:5%;
  right:5%;
  z-index:2;
}

.m-hero-badge{
  display:inline-block;
  background:var(--primary);
  color:#fff;
  font-size:11px;
  font-weight:bold;
  padding:5px 12px;
  border-radius:15px;
  margin-bottom:10px;
  text-transform:uppercase;
}

.m-hero-title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:8px;
  text-shadow:2px 2px 6px rgba(0,0,0,0.9);
}

.m-hero-meta{
  font-size:14px;
  color:#ddd;
  margin-bottom:15px;
}

.m-hero-buttons{
  display:flex;
  gap:10px;
}

.m-btn-hero{
  padding:12px 20px;
  border-radius:10px;
  font-weight:bold;
  font-size:14px;
  border:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
}

.m-btn-play{
  background:#fff;
  color:#000;
}

.m-btn-list{
  background:rgba(255,255,255,0.2);
  color:#fff;
}

.m-row{
  margin-bottom:25px;
  padding-left:15px;
}

.m-row-header{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
  color:#ececef;
}

.m-slider{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-right:15px;
  padding-bottom:5px;
}

.m-card{
  flex:0 0 auto;
  width:130px;
  border-radius:10px;
  overflow:hidden;
  position:relative;
  background:var(--surface);
  cursor:pointer;
  transition:transform 0.2s;
}

.m-card:active{transform:scale(0.95);}

.m-card-img-wrap{
  position:relative;

}

.m-card-img{
  position:absolute;

}

.m-card-overlay{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:15px 8px 8px;
  background:linear-gradient(to top, rgba(0,0,0,0.9), transparent);
}

.m-card-title{
  font-weight:bold;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.m-card-meta{
  font-size:11px;
  color:#bbb;
  margin-top:2px;
}

.m-card-badge{
  position:absolute;
  top:6px;
  left:6px;
  background:rgba(0,0,0,0.7);
  color:#fff;
  font-size:9px;
  font-weight:bold;
  padding:3px 6px;
  border-radius:4px;
  text-transform:uppercase;
  z-index:2;
}

.m-card-badge.live{
  background:var(--primary);
}

.m-card-list-btn{
  position:absolute;
  top:6px;
  right:6px;
  width:25px;
  height:25px;
  border-radius:50%;
  background:rgba(0,0,0,0.7);
  border:1px solid rgba(255,255,255,0.3);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:3;
  font-size:10px;
}

.m-card-list-btn.in-list{
  background:var(--primary);
  border-color:var(--primary);
}

.m-nav-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  padding:10px;
  z-index:100;
}

.m-nav{
  display:flex;
  gap:5px;
  background:rgba(20,20,28,0.95);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;
  padding:5px;
}

.m-nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  color:#8a8a94;
  background:none;
  border:none;
  font-size:9px;
  font-weight:bold;
  cursor:pointer;
  padding:8px 12px;
  border-radius:15px;
  transition:all 0.2s;
}

.m-nav-item i{font-size:16px;}

.m-nav-item.active{
  color:#fff;
  background:var(--primary);
}

/* --- Búsqueda móvil --- */
.m-search-screen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#050508;
  z-index:200;
  display:none;
  padding:15px;
  overflow-y:auto;
}

.m-search-screen.active{display:block;}

.m-search-header{
  display:flex;
  align-items:center;
  gap:10px;

}

.m-search-back{

  border:none;

}

.m-search-input-wrap input{
  flex:1;
  padding:10px 0;
  background:transparent;
  border:none;
  color:#fff;

}

.m-filters{

  margin-bottom:15px;

.m-chip{

  cursor:pointer;
  font-weight:bold;

}

.m-chip.active{

}

.m-search-results{

  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

/* --- Perfil móvil --- */
.m-profile-panel{
  position:fixed;
  top:0;
  right:-100%;
  width:80%;
  max-width:320px;
  height:100%;
  background:#0a0a0e;
  z-index:300;
  transition:right 0.3s;
  padding:20px;
  border-left:1px solid rgba(255,255,255,0.1);
}

.m-profile-panel.open{right:0;}

.m-panel-close{
  position:absolute;
  top:15px;
  right:15px;
  background:rgba(255,255,255,0.1);
  border:none;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  padding:8px 10px;
  border-radius:8px;
}

.m-panel-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px 5px;
  color:#ccc;
  border-bottom:1px solid rgba(255,255,255,0.08);
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
}

.m-panel-item i{
  width:20px;
  color:var(--primary);
}

/* --- Reproductor móvil --- */
.m-player-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  z-index:9999;
  display:none;
}

.m-player-overlay.active{display:block;}

.m-player-frame{
  width:100%;
  height:100%;
  border:none;
}

.m-close-player{
  position:absolute;
  top:15px;
  right:15px;
  background:rgba(0,0,0,0.7);
  border:1px solid rgba(255,255,255,0.3);
  color:#fff;
  width:35px;
  height:35px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;

  z-index:10;
  font-size:14px;
}

/* --- Grid móvil --- */
.m-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:70px 12px 15px;
}

.m-grid .m-card{
  width:100%;
}

.m-section-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:5px;
  grid-column:1/-1;
}

.m-empty{
  color:var(--text-faint);
  grid-column:1/-1;
  text-align:center;
  padding:40px 15px;
  font-size:14px;
}

   Utilidades
   ====================================================================== */
[tabindex]{outline:none;}
</style>
</head>
<body>

  <div class="m-panel-item" onclick="mShowSection('mylist');mToggleProfile();"><i class="fas fa-bookmark"></i> Mi lista</div>
  <div class="m-panel-item" onclick="mShowSection('history');mToggleProfile();"><i class="fas fa-clock-rotate-left"></i> Historial</div>

  <div class="tv-body">

      <button class="tv-chip active" data-filter="all" data-tv-nav data-row="search-filters" data-col="0" onclick="tvSetFilter('all',this)">Todos</button>
      <button class="tv-chip" data-filter="pelicula" data-tv-nav data-row="search-filters" data-col="1" onclick="tvSetFilter('pelicula',this)">Películas</button>
      <button class="tv-chip" data-filter="serie" data-tv-nav data-row="search-filters" data-col="2" onclick="tvSetFilter('serie',this)">Series</button>

    <iframe class="tv-player-frame" id="tvPlayerFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>

  <div class="tv-remote-hints" id="tvRemoteHints">
    <span><span class="tv-key">↑↓←→</span> Navegar</span>
    <span><span class="tv-key">OK</span> Seleccionar</span>
    <span><span class="tv-key">⌫</span> Volver</span>
  </div>
</div>

<script>
/* ==========================================================================
   CONFIGURACIÓN Y DATOS
   ========================================================================== */
var SUPABASE_URL = 'https://rojsndimvyjzgstxivqo.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_djOXqhg8VILB9fwLLFkNlg_xjWvBqEh';

var supabaseClient = null;
try {
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch(e) {
  console.error('Error creando cliente Supabase:', e);
}

var currentUser = {
  id: 'guest',
  nombre: 'Invitado',
  celular: '',
  edad: null
};
var allContent = [];
var myList = [];
var history = [];
var heroContent = [];
var deviceMode = 'mobile';

/* ==========================================================================
   DETECCIÓN DE DISPOSITIVO
   ========================================================================== */
function detectDevice(){
  var forced = localStorage.getItem('finki_force_mode');
  if (forced === 'tv' || forced === 'mobile') return forced;
  
  var ua = navigator.userAgent || '';
  var tvUA = /SmartTV|SMART-TV|Tizen|WebOS|Web0S|GoogleTV|HbbTV|NetCast|VIDAA|BRAVIA|AFT|CrKey|Roku|POV_TV|AQUOS|Opera TV|Viera|Vizio|LG NetCast/i.test(ua);
  var hasTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  var wide = window.innerWidth >= 1000;
  
  if (tvUA) return 'tv';
  if (wide && !hasTouch) return 'tv';
  return 'mobile';
}

function applyDeviceMode(){
  deviceMode = detectDevice();
  
  var mobileApp = document.getElementById('appMobile');
  var tvApp = document.getElementById('appTV');
  
  if (deviceMode === 'mobile') {
    mobileApp.className = 'app active';
    tvApp.className = 'app';
  } else {
    mobileApp.className = 'app';
    tvApp.className = 'app active';
  }
}

// Cambio manual de modo: triple clic en el logo
(function setupModeSwitcher(){
  var taps = 0;
  var timer = null;
  
  document.addEventListener('click', function(e) {
    var target = e.target;
    if (target.className.indexOf('m-logo') === -1 && target.className.indexOf('tv-rail-logo') === -1) return;
    
    taps++;
    clearTimeout(timer);
    timer = setTimeout(function() { taps = 0; }, 900);
    
    if (taps >= 3) {
      taps = 0;
      var current = localStorage.getItem('finki_force_mode') || detectDevice();
      var next = current === 'tv' ? 'mobile' : 'tv';
      localStorage.setItem('finki_force_mode', next);
      location.reload();
    }
  });
})();

/* ==========================================================================
   DATOS DE USUARIO
   ========================================================================== */
function updateProfileUI(){
  var initial = currentUser.nombre.charAt(0).toUpperCase();
  
  var mAv = document.getElementById('mAvatar');
  if (mAv) mAv.textContent = initial;
  
  var mPAv = document.getElementById('mPanelAvatar');
  if (mPAv) mPAv.textContent = initial;
  
  var mPName = document.getElementById('mPanelName');
  if (mPName) mPName.textContent = currentUser.nombre;
  
  var tvAv = document.getElementById('tvAvatar');
  if (tvAv) tvAv.textContent = initial;
}

function loadUserData(){
  var base = 'finki_guest';
  try {
    myList = JSON.parse(localStorage.getItem(base + '_mylist') || '[]');
    history = JSON.parse(localStorage.getItem(base + '_history') || '[]');
  } catch(e) {
    myList = [];
    history = [];
  }
}

function saveList(){
  try {
    localStorage.setItem('finki_guest_mylist', JSON.stringify(myList));
  } catch(e) {}
}

function saveHistory(){
  try {
    localStorage.setItem('finki_guest_history', JSON.stringify(history));
  } catch(e) {}
}

function escapeHtml(str){
  if (!str) return '';
  return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

var PLACEHOLDER_IMG = 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 150%22><rect fill=%22%231c1c26%22 width=%22100%22 height=%22150%22/></svg>';

/* ==========================================================================
   OBTENCIÓN DE CONTENIDO
   ========================================================================== */
async function fetchContent(){
  if (!supabaseClient) {
    console.error('Supabase no está disponible');
    if (deviceMode === 'mobile') mShowSection('home');
    else tvShowSection('home');
    return;
  }
  
  try {
    var result = await supabaseClient.from('contenido').select('*, categorias(nombre)').order('fecha_agregado', { ascending: false });
    
    if (result.error) {
      console.error('Error fetching content:', result.error);
      return;
    }
    
    allContent = result.data || [];
    
    if (allContent.length > 0) {
      heroContent = allContent.slice(0, 5);
    }
    
    if (deviceMode === 'mobile') {
      mShowSection('home');
    } else {
      tvShowSection('home');
    }
  } catch(e) {
    console.error('Error en fetchContent:', e);
  }
}

function addToHistory(item){
  history = history.filter(function(i) { return i.id !== item.id; });
  history.unshift({
    id: item.id,
    nombre: item.nombre,
    url_contenido: item.url_contenido,
    tipo: item.tipo,
    url_portada: item.url_portada
  });
  if (history.length > 30) history.pop();
  saveHistory();
}

function toggleList(contentId){
  var item = null;
  for (var i = 0; i < allContent.length; i++) {
    if (allContent[i].id === contentId) {
      item = allContent[i];
      break;
    }
  }
  
  if (!item) return;
  
  var idx = -1;
  for (var j = 0; j < myList.length; j++) {
    if (myList[j].id === contentId) {
      idx = j;
      break;
    }
  }
  
  if (idx === -1) {
    myList.push({
      id: item.id,
      nombre: item.nombre,
      url_contenido: item.url_contenido,
      url_portada: item.url_portada,
      tipo: item.tipo
    });
  } else {
    myList.splice(idx, 1);
  }
  
  saveList();
  
  if (deviceMode === 'mobile') {
    mShowSection(mCurrentSection);
  } else {
    tvShowSection(tvCurrentSection);
  }
}

/* ##########################################################################
   ####################   MOTOR MÓVIL   #####################################
   ########################################################################## */
var mCurrentSection = 'home';
var mCurrentHeroIndex = 0;
var mHeroInterval = null;

function mShowSection(section){
  mCurrentSection = section;
  
  if (section !== 'home') mStopHeroRotation();
  
  var navItems = document.querySelectorAll('.m-nav-item');
  for (var i = 0; i < navItems.length; i++) {
    navItems[i].className = 'm-nav-item';
    if (navItems[i].getAttribute('data-section') === section) {
      navItems[i].className = 'm-nav-item active';
    }
  }
  
  var content = document.getElementById('mContent');
  
  switch(section){
    case 'home':
      mRenderHome();
      break;
    case 'movies':
      mRenderCategory('pelicula', '🎬 Películas', 'fa-film');
      break;
    case 'series':
      mRenderCategory('serie', '📺 Series', 'fa-tv');
      break;
    case 'channels':
      mRenderCategory('canal', '📡 Canales en vivo', 'fa-satellite-dish');
      break;
    case 'mylist':
      mRenderList(myList, '📌 Mi lista', 'fa-bookmark', 'Tu lista está vacía');
      break;
    case 'history':
      mRenderList(history, '🕐 Historial', 'fa-clock-rotate-left', 'No hay historial');
      break;
  }
  
  window.scrollTo(0, 0);
}

function mRenderHome(){
  var content = document.getElementById('mContent');
  var html = '';
  
  if (heroContent.length > 0){
    html += '<div class="m-hero" id="mHero">';
    
    for (var i = 0; i < heroContent.length; i++) {
      var item = heroContent[i];
      var activeClass = i === 0 ? ' active' : '';
      html += '<div class="m-hero-slide' + activeClass + '" style="background-image:url(\'' + (item.url_portada || '') + '\')"></div>';
    }
    
    html += '<div class="m-hero-gradient"></div>';
    html += '<div class="m-hero-content">';
    html += '<span class="m-hero-badge"><i class="fas fa-star"></i> Destacado</span>';
    html += '<h1 class="m-hero-title" id="mHeroTitle">' + heroContent[0].nombre + '</h1>';
    html += '<p class="m-hero-meta" id="mHeroMeta"><i class="fas fa-tag"></i> ' + (heroContent[0].categorias?.nombre || 'Contenido exclusivo') + '</p>';
    html += '<div class="m-hero-buttons">';
    html += '<button class="m-btn-hero m-btn-play" onclick="mPlayHero()"><i class="fas fa-play"></i> Reproducir</button>';
    html += '<button class="m-btn-hero m-btn-list" onclick="mAddHeroToList()"><i class="fas fa-plus"></i></button>';
    html += '</div></div></div>';
  }
  
  var destacados = allContent.slice(5, 15);
  var peliculas = [];
  var series = [];
  var canales = [];
  
  for (var j = 0; j < allContent.length; j++) {
    var item = allContent[j];
    if (item.tipo === 'pelicula' && peliculas.length < 10) peliculas.push(item);
    if (item.tipo === 'serie' && series.length < 10) series.push(item);
    if (item.tipo === 'canal' && canales.length < 10) canales.push(item);
  }
  
  if (destacados.length) html += mRow('🔥 Destacados', destacados);
  if (peliculas.length) html += mRow('🎬 Películas', peliculas);
  if (series.length) html += mRow('📺 Series', series);
  if (canales.length) html += mRow('📡 En vivo', canales, true);
  
  content.innerHTML = html;
  
  if (heroContent.length) {
    mStartHeroRotation();
  }
}

function mRow(title, items, wide){
  var html = '<div class="m-row">';
  html += '<h2 class="m-row-header">' + title + '</h2>';
  html += '<div class="m-slider">';
  
  for (var i = 0; i < items.length; i++) {
    html += mCard(items[i]);
  }
  
  html += '</div></div>';
  return html;
}

function mCard(item){
  var inList = false;
  for (var i = 0; i < myList.length; i++) {
    if (myList[i].id === item.id) {
      inList = true;
      break;
    }
  }
  
  var badge = item.tipo === 'canal' ? 'EN VIVO' : (item.tipo === 'serie' ? 'Serie' : 'Película');
  var badgeClass = item.tipo === 'canal' ? ' live' : '';
  
  var html = '<div class="m-card" onclick="mPlayContent(\'' + escapeHtml(item.url_contenido) + '\',\'' + item.id + '\')">';
  html += '<div class="m-card-img-wrap">';
  html += '<img src="' + (item.url_portada || PLACEHOLDER_IMG) + '" class="m-card-img" loading="lazy" onerror="this.src=\'' + PLACEHOLDER_IMG + '\'">';
  html += '<span class="m-card-badge' + badgeClass + '">' + badge + '</span>';
  html += '<button class="m-card-list-btn' + (inList ? ' in-list' : '') + '" onclick="event.stopPropagation();toggleList(\'' + item.id + '\')"><i class="fas ' + (inList ? 'fa-check' : 'fa-plus') + '"></i></button>';
  html += '<div class="m-card-overlay"><div class="m-card-title">' + item.nombre + '</div><div class="m-card-meta">' + (item.categorias?.nombre || 'General') + '</div></div>';
  html += '</div></div>';
  
  return html;
}

function mRenderCategory(tipo, title, icon){
  var items = [];
  for (var i = 0; i < allContent.length; i++) {
    if (allContent[i].tipo === tipo) {
      items.push(allContent[i]);
    }
  }
  
  var html = '<div class="m-grid">';
  html += '<h1 class="m-section-title"><i class="fas ' + icon + '"></i> ' + title + '</h1>';
  
  if (items.length) {
    for (var j = 0; j < items.length; j++) {
      html += mCard(items[j]);
    }
  } else {
    html += '<div class="m-empty"><i class="fas ' + icon + '"></i>No hay contenido disponible</div>';
  }
  
  html += '</div>';
  document.getElementById('mContent').innerHTML = html;
}

function mRenderList(list, title, icon, emptyMsg){
  var html = '<div class="m-grid">';
  html += '<h1 class="m-section-title"><i class="fas ' + icon + '"></i> ' + title + '</h1>';
  
  if (list.length) {
    for (var i = 0; i < list.length; i++) {
      html += mCard(list[i]);
    }
  } else {
    html += '<div class="m-empty"><i class="fas ' + icon + '"></i>' + emptyMsg + '</div>';
  }
  
  html += '</div>';
  document.getElementById('mContent').innerHTML = html;
}

function mStartHeroRotation(){
  mStopHeroRotation();
  if (heroContent.length > 1) {
    mHeroInterval = setInterval(function() {
      mCurrentHeroIndex = (mCurrentHeroIndex + 1) % heroContent.length;
      mUpdateHeroSlide(mCurrentHeroIndex);
    }, 5500);
  }
}

function mStopHeroRotation(){
  if (mHeroInterval) {
    clearInterval(mHeroInterval);
    mHeroInterval = null;
  }
}

function mUpdateHeroSlide(index){
  var item = heroContent[index];
  if (!item) return;
  
  var titleEl = document.getElementById('mHeroTitle');
  var metaEl = document.getElementById('mHeroMeta');
  
  if (titleEl) titleEl.textContent = item.nombre;
  if (metaEl) metaEl.innerHTML = '<i class="fas fa-tag"></i> ' + (item.categorias?.nombre || 'Contenido exclusivo');
  
  var slides = document.querySelectorAll('#mHero .m-hero-slide');
  for (var i = 0; i < slides.length; i++) {
    if (i === index) {
      slides[i].className = 'm-hero-slide active';
    } else {
      slides[i].className = 'm-hero-slide';
    }
  }
  
  mCurrentHeroIndex = index;
}

function mPlayContent(url, contentId){
  var finalUrl = url;
  
  if (url.indexOf('<iframe') !== -1) {
    var match = url.match(/src=["']([^"']+)["']/);
    if (match) finalUrl = match[1];
  }
  
  if (finalUrl.indexOf('youtube.com') !== -1 && finalUrl.indexOf('autoplay=1') === -1) {
    finalUrl += (finalUrl.indexOf('?') !== -1 ? '&' : '?') + 'autoplay=1';
  }
  
  var frame = document.getElementById('mPlayerFrame');
  var overlay = document.getElementById('mPlayerOverlay');
  
  frame.src = finalUrl;
  overlay.className = 'm-player-overlay active';
  
  var item = null;
  for (var i = 0; i < allContent.length; i++) {
    if (allContent[i].id === contentId) {
      item = allContent[i];
      break;
    }
  }
  
  if (item) addToHistory(item);
}

function mClosePlayer(){
  var frame = document.getElementById('mPlayerFrame');
  var overlay = document.getElementById('mPlayerOverlay');
  
  frame.src = '';
  overlay.className = 'm-player-overlay';
  
  if (document.fullscreenElement) document.exitFullscreen();
}

function mPlayHero(){
  if (heroContent.length) {
    mPlayContent(heroContent[mCurrentHeroIndex].url_contenido, heroContent[mCurrentHeroIndex].id);
  }
}

function mAddHeroToList(){
  if (heroContent.length) {
    toggleList(heroContent[mCurrentHeroIndex].id);
  }
}

function mOpenSearch(){
  document.getElementById('mSearchScreen').className = 'm-search-screen active';
  setTimeout(function() {
    document.getElementById('mSearchInput').focus();
  }, 300);
}

function mCloseSearch(){
  document.getElementById('mSearchScreen').className = 'm-search-screen';
  document.getElementById('mSearchInput').value = '';
  document.getElementById('mSearchResults').innerHTML = '';
}

function mClearSearch(){
  document.getElementById('mSearchInput').value = '';
  var activeFilter = document.querySelector('#mSearchFilters .m-chip.active');
  mPerformSearch('', activeFilter ? activeFilter.getAttribute('data-filter') : 'all');
}

function mPerformSearch(query, filter){
  var results = allContent.slice();
  
  if (query) {
    var q = query.toLowerCase();
    results = results.filter(function(item) {
      return item.nombre.toLowerCase().indexOf(q) !== -1 || 
             (item.categorias?.nombre && item.categorias.nombre.toLowerCase().indexOf(q) !== -1);
    });
  }
  
  if (filter !== 'all') {
    results = results.filter(function(item) {
      return item.tipo === filter;
    });
  }
  
  var html = '';
  if (results.length) {
    for (var i = 0; i < results.length; i++) {
      html += mCard(results[i]);
    }
  } else {
    html = '<div class="m-empty" style="grid-column:1/-1"><i class="fas fa-magnifying-glass"></i>Sin resultados</div>';
  }
  
  document.getElementById('mSearchResults').innerHTML = html;
}

function mToggleProfile(){
  var panel = document.getElementById('mProfilePanel');
  if (panel.className.indexOf('open') !== -1) {
    panel.className = 'm-profile-panel';
  } else {
    panel.className = 'm-profile-panel open';
  }
}

// Eventos móviles
document.getElementById('mSearchInput')?.addEventListener('input', function() {
  var activeFilter = document.querySelector('#mSearchFilters .m-chip.active');
  mPerformSearch(this.value, activeFilter ? activeFilter.getAttribute('data-filter') : 'all');
});

var mChips = document.querySelectorAll('#mSearchFilters .m-chip');
for (var i = 0; i < mChips.length; i++) {
  mChips[i].addEventListener('click', function() {
    var chips = document.querySelectorAll('#mSearchFilters .m-chip');
    for (var j = 0; j < chips.length; j++) {
      chips[j].className = 'm-chip';
    }
    this.className = 'm-chip active';
    
    mPerformSearch(document.getElementById('mSearchInput').value, this.getAttribute('data-filter'));
  });
}

var mNavItems = document.querySelectorAll('#mNav .m-nav-item');
for (var k = 0; k < mNavItems.length; k++) {
  mNavItems[k].addEventListener('click', function() {
    mShowSection(this.getAttribute('data-section'));
  });
}

/* ##########################################################################
   ####################   MOTOR TV   ########################################
   ########################################################################## */
var tvCurrentSection = 'home';
var tvCurrentHeroIndex = 0;
var tvHeroInterval = null;
var tvFocusRow = 'rail';
var tvFocusCol = 0;
var tvContext = 'home';
var tvCurrentFilter = 'all';

function tvShowSection(section){
  tvCurrentSection = section;
  
  document.getElementById('tvSearchScreen').className = 'tv-search-screen';
  
  if (section !== 'home') tvStopHeroRotation();
  
  var railItems = document.querySelectorAll('.tv-rail-item');
  for (var i = 0; i < railItems.length; i++) {
    railItems[i].className = 'tv-rail-item';
    if (railItems[i].getAttribute('data-section') === section) {
      railItems[i].className = 'tv-rail-item active';
    }
  }
  
  if (section === 'search') {
    document.getElementById('tvSearchScreen').className = 'tv-search-screen active';
    tvPerformSearch('', tvCurrentFilter);
    tvContext = 'search';
    tvSetFocus('search-filters', 0);
    return;
  }
  
  tvContext = 'home';
  var content = document.getElementById('tvContent');
  
  switch(section){
    case 'home':
      tvRenderHome();
      break;
    case 'movies':
      tvRenderCategory('pelicula', '🎬 Películas');
      break;
    case 'series':
      tvRenderCategory('serie', '📺 Series');
      break;
    case 'channels':
      tvRenderCategory('canal', '📡 Canales en vivo');
      break;
    case 'mylist':
      tvRenderList(myList, '📌 Mi lista', 'Tu lista está vacía');
      break;
  }
  
  content.scrollTop = 0;
  
  setTimeout(function() {
    var firstNavEl = content.querySelector('[data-tv-nav]');
    if (firstNavEl) {
      tvSetFocus(firstNavEl.getAttribute('data-row'), 0);
    } else {
      tvSetFocus('rail', tvGetRailCol(section));
    }
  }, 100);
}

function tvGetRailCol(section){
  var el = document.querySelector('.tv-rail-item[data-section="' + section + '"]');
  return el ? parseInt(el.getAttribute('data-col')) : 0;
}

function tvRenderHome(){
  var content = document.getElementById('tvContent');
  var html = '';
  
  if (heroContent.length){
    html += '<div class="tv-hero" id="tvHero">';
    
    for (var i = 0; i < heroContent.length; i++) {
      var item = heroContent[i];
      var activeClass = i === 0 ? ' active' : '';
      html += '<div class="tv-hero-slide' + activeClass + '" style="background-image:url(\'' + (item.url_portada || '') + '\')"></div>';
    }
    
    html += '<div class="tv-hero-gradient"></div>';
    html += '<div class="tv-hero-content">';
    html += '<span class="tv-hero-badge"><i class="fas fa-star"></i> Destacado</span>';
    html += '<h1 class="tv-hero-title" id="tvHeroTitle">' + heroContent[0].nombre + '</h1>';
    html += '<p class="tv-hero-meta" id="tvHeroMeta"><i class="fas fa-tag"></i> ' + (heroContent[0].categorias?.nombre || 'Contenido exclusivo') + '</p>';
    html += '<div class="tv-hero-buttons">';
    html += '<button class="tv-btn-hero tv-btn-play" data-tv-nav data-row="hero" data-col="0" onclick="tvPlayHero()"><i class="fas fa-play"></i> Reproducir</button>';
    html += '<button class="tv-btn-hero tv-btn-list" data-tv-nav data-row="hero" data-col="1" onclick="tvAddHeroToList()"><i class="fas fa-plus"></i> Mi lista</button>';
    html += '</div></div></div>';
  }
  
  var destacados = allContent.slice(5, 15);
  var peliculas = [];
  var series = [];
  var canales = [];
  
  for (var j = 0; j < allContent.length; j++) {
    var item = allContent[j];
    if (item.tipo === 'pelicula' && peliculas.length < 10) peliculas.push(item);
    if (item.tipo === 'serie' && series.length < 10) series.push(item);
    if (item.tipo === 'canal' && canales.length < 10) canales.push(item);
  }
  
  var rowIdx = 0;
  if (destacados.length) {
    html += tvRow('🔥 Destacados', destacados, 'row' + rowIdx);
    rowIdx++;
  }
  if (peliculas.length) {
    html += tvRow('🎬 Películas', peliculas, 'row' + rowIdx);
    rowIdx++;
  }
  if (series.length) {
    html += tvRow('📺 Series', series, 'row' + rowIdx);
    rowIdx++;
  }
  if (canales.length) {
    html += tvRow('📡 En vivo', canales, 'row' + rowIdx);
    rowIdx++;
  }
  
  content.innerHTML = html;
  
  if (heroContent.length) tvStartHeroRotation();
}

function tvRow(title, items, rowKey){
  var html = '<div class="tv-row">';
  html += '<h2 class="tv-row-header">' + title + '</h2>';
  html += '<div class="tv-slider">';
  
  for (var i = 0; i < items.length; i++) {
    html += tvCard(items[i], rowKey, i);
  }
  
  html += '</div></div>';
  return html;
}

function tvCard(item, rowKey, col){
  var inList = false;
  for (var i = 0; i < myList.length; i++) {
    if (myList[i].id === item.id) {
      inList = true;
      break;
    }
  }
  
  var badge = item.tipo === 'canal' ? 'EN VIVO' : (item.tipo === 'serie' ? 'Serie' : 'Película');
  var badgeClass = item.tipo === 'canal' ? ' live' : '';
  
  var html = '<div class="tv-card" data-tv-nav data-row="' + rowKey + '" data-col="' + col + '"';
  html += ' data-content-id="' + item.id + '"';
  html += ' onclick="tvPlayContent(\'' + escapeHtml(item.url_contenido) + '\',\'' + item.id + '\')">';
  html += '<div class="tv-card-img-wrap">';
  html += '<img src="' + (item.url_portada || PLACEHOLDER_IMG) + '" class="tv-card-img" loading="lazy" onerror="this.src=\'' + PLACEHOLDER_IMG + '\'">';
  html += '<span class="tv-card-badge' + badgeClass + '">' + badge + '</span>';
  html += '<div class="tv-card-overlay"><div class="tv-card-title">' + item.nombre + '</div><div class="tv-card-meta">' + (item.categorias?.nombre || 'General') + '</div></div>';
  html += '</div></div>';
  
  return html;
}

function tvRenderCategory(tipo, title){
  var items = [];
  for (var i = 0; i < allContent.length; i++) {
    if (allContent[i].tipo === tipo) {
      items.push(allContent[i]);
    }
  }
  
  var html = '<div class="tv-grid">';
  html += '<h1 class="tv-section-title">' + title + '</h1>';
  
  if (items.length) {
    for (var j = 0; j < items.length; j++) {
      html += tvCard(items[j], 'grid', j);
    }
  } else {
    html += '<div class="tv-empty"><i class="fas fa-ghost"></i>No hay contenido disponible</div>';
  }
  
  html += '</div>';
  document.getElementById('tvContent').innerHTML = html;
}

function tvRenderList(list, title, emptyMsg){
  var html = '<div class="tv-grid">';
  html += '<h1 class="tv-section-title">' + title + '</h1>';
  
  if (list.length) {
    for (var i = 0; i < list.length; i++) {
      html += tvCard(list[i], 'grid', i);
    }
  } else {
    html += '<div class="tv-empty"><i class="fas fa-bookmark"></i>' + emptyMsg + '</div>';
  }
  
  html += '</div>';
  document.getElementById('tvContent').innerHTML = html;
}

function tvStartHeroRotation(){
  tvStopHeroRotation();
  if (heroContent.length > 1) {
    tvHeroInterval = setInterval(function() {
      tvCurrentHeroIndex = (tvCurrentHeroIndex + 1) % heroContent.length;
      tvUpdateHeroSlide(tvCurrentHeroIndex);
    }, 6000);
  }
}

function tvStopHeroRotation(){
  if (tvHeroInterval) {
    clearInterval(tvHeroInterval);
    tvHeroInterval = null;
  }
}

function tvUpdateHeroSlide(index){
  var item = heroContent[index];
  if (!item) return;
  
  var titleEl = document.getElementById('tvHeroTitle');
  var metaEl = document.getElementById('tvHeroMeta');
  
  if (titleEl) titleEl.textContent = item.nombre;
  if (metaEl) metaEl.innerHTML = '<i class="fas fa-tag"></i> ' + (item.categorias?.nombre || 'Contenido exclusivo');
  
  var slides = document.querySelectorAll('#tvHero .tv-hero-slide');
  for (var i = 0; i < slides.length; i++) {
    if (i === index) {
      slides[i].className = 'tv-hero-slide active';
    } else {
      slides[i].className = 'tv-hero-slide';
    }
  }
  
  tvCurrentHeroIndex = index;
}

function tvPlayContent(url, contentId){
  var finalUrl = url;
  
  if (url.indexOf('<iframe') !== -1) {
    var match = url.match(/src=["']([^"']+)["']/);
    if (match) finalUrl = match[1];
  }
  
  if (finalUrl.indexOf('youtube.com') !== -1 && finalUrl.indexOf('autoplay=1') === -1) {
    finalUrl += (finalUrl.indexOf('?') !== -1 ? '&' : '?') + 'autoplay=1';
  }
  
  var frame = document.getElementById('tvPlayerFrame');
  var overlay = document.getElementById('tvPlayerOverlay');
  
  frame.src = finalUrl;
  overlay.className = 'tv-player-overlay active';
  
  var item = null;
  for (var i = 0; i < allContent.length; i++) {
    if (allContent[i].id === contentId) {
      item = allContent[i];
      break;
    }
  }
  
  if (item) addToHistory(item);
  
  tvContext = 'player';
  tvSetFocus('player', 0);
}

function tvClosePlayer(){
  var frame = document.getElementById('tvPlayerFrame');
  var overlay = document.getElementById('tvPlayerOverlay');
  
  frame.src = '';
  overlay.className = 'tv-player-overlay';
  
  if (document.fullscreenElement) document.exitFullscreen();
  
  tvContext = 'home';
  tvSetFocus('rail', tvGetRailCol(tvCurrentSection));
}

function tvPlayHero(){
  if (heroContent.length) {
    tvPlayContent(heroContent[tvCurrentHeroIndex].url_contenido, heroContent[tvCurrentHeroIndex].id);
  }
}

function tvAddHeroToList(){
  if (heroContent.length) {
    toggleList(heroContent[tvCurrentHeroIndex].id);
  }
}

function tvSetFilter(filter, el){
  tvCurrentFilter = filter;
  
  var chips = document.querySelectorAll('#tvSearchFilters .tv-chip');
  for (var i = 0; i < chips.length; i++) {
    chips[i].className = 'tv-chip';
  }
  
  if (el) {
    el.className = 'tv-chip active';
  } else {
    var chip = document.querySelector('#tvSearchFilters .tv-chip[data-filter="' + filter + '"]');
    if (chip) chip.className = 'tv-chip active';
  }
  
  tvPerformSearch(document.getElementById('tvSearchInput').value, filter);
}

function tvPerformSearch(query, filter){
  var results = allContent.slice();
  
  if (query) {
    var q = query.toLowerCase();
    results = results.filter(function(item) {
      return item.nombre.toLowerCase().indexOf(q) !== -1 || 
             (item.categorias?.nombre && item.categorias.nombre.toLowerCase().indexOf(q) !== -1);
    });
  }
  
  if (filter !== 'all') {
    results = results.filter(function(item) {
      return item.tipo === filter;
    });
  }
  
  document.getElementById('tvSearchInput').value = query || '';
  
  var html = '';
  if (results.length) {
    for (var i = 0; i < results.length; i++) {
      html += tvCard(results[i], 'search-results', i);
    }
  } else {
    html = '<div class="tv-empty"><i class="fas fa-magnifying-glass"></i>Sin resultados</div>';
  }
  
  document.getElementById('tvSearchResults').innerHTML = html;
}

// Eventos de búsqueda TV
document.getElementById('tvSearchInput').addEventListener('input', function() {
  tvPerformSearch(this.value, tvCurrentFilter);
});

/* --- Navegación espacial TV --- */
function tvAllFocusable(){
  var elements = document.querySelectorAll('#appTV.active [data-tv-nav]');
  var visible = [];
  
  for (var i = 0; i < elements.length; i++) {
    if (elements[i].offsetParent !== null || elements[i].offsetHeight > 0) {
      visible.push(elements[i]);
    }
  }
  
  return visible;
}

function tvGroupsByRow(){
  var groups = {};
  var focusable = tvAllFocusable();
  
  for (var i = 0; i < focusable.length; i++) {
    var el = focusable[i];
    var row = el.getAttribute('data-row');
    
    if (!groups[row]) groups[row] = [];
    groups[row].push(el);
  }
  
  for (var key in groups) {
    groups[key].sort(function(a, b) {
      return parseInt(a.getAttribute('data-col')) - parseInt(b.getAttribute('data-col'));
    });
  }
  
  return groups;
}

function tvSetFocus(row, col){
  var groups = tvGroupsByRow();
  var list = groups[row];
  
  if (!list || !list.length) {
    row = 'rail';
    col = 0;
    list = groups['rail'];
  }
  
  if (!list || !list.length) return;
  
  col = Math.max(0, Math.min(col, list.length - 1));
  
  var focusedElements = document.querySelectorAll('.tv-focused');
  for (var i = 0; i < focusedElements.length; i++) {
    focusedElements[i].className = focusedElements[i].className.replace(' tv-focused', '').replace('tv-focused', '');
  }
  
  var target = list[col];
  target.className += ' tv-focused';
  
  try {
    target.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  } catch(e) {
    // Fallback para navegadores antiguos
    target.focus();
  }
  
  tvFocusRow = row;
  tvFocusCol = col;
}

function tvMove(direction){
  var groups = tvGroupsByRow();
  var currentList = groups[tvFocusRow] || [];
  
  if (direction === 'left') {
    if (tvFocusCol > 0) {
      tvSetFocus(tvFocusRow, tvFocusCol - 1);
    } else if (tvFocusRow !== 'rail') {
      tvSetFocus('rail', tvGetRailCol(tvCurrentSection));
    }
    return;
  }
  
  if (direction === 'right') {
    if (tvFocusCol < currentList.length - 1) {
      tvSetFocus(tvFocusRow, tvFocusCol + 1);
    }
    return;
  }
  
  if (tvContext === 'search') {
    var searchRows = ['search-input', 'search-filters', 'search-results'];
    var currentIdx = searchRows.indexOf(tvFocusRow);
    
    if (direction === 'down' && currentIdx < searchRows.length - 1) {
      tvSetFocus(searchRows[currentIdx + 1], 0);
    }
    if (direction === 'up' && currentIdx > 0) {
      tvSetFocus(searchRows[currentIdx - 1], 0);
    }
    return;
  }
  
  if (tvFocusRow === 'rail') {
    if (direction === 'down' && tvFocusCol < currentList.length - 1) {
      tvSetFocus('rail', tvFocusCol + 1);
    }
    if (direction === 'up' && tvFocusCol > 0) {
      tvSetFocus('rail', tvFocusCol - 1);
    }
    if (direction === 'right') {
      var rows = tvGetContentRows();
      if (rows.length) tvSetFocus(rows[0], 0);
    }
    return;
  }
  
  var contentRows = tvGetContentRows();
  var idx = contentRows.indexOf(tvFocusRow);
  
  if (direction === 'down' && idx < contentRows.length - 1) {
    tvSetFocus(contentRows[idx + 1], tvFocusCol);
  }
  if (direction === 'up') {
    if (idx > 0) {
      tvSetFocus(contentRows[idx - 1], tvFocusCol);
    } else {
      tvSetFocus('rail', tvGetRailCol(tvCurrentSection));
    }
  }
}

function tvGetContentRows(){
  var rows = [];
  var groups = tvGroupsByRow();
  
  if (document.getElementById('tvHero')) {
    rows.push('hero');
  }
  
  var content = document.getElementById('tvContent');
  if (content) {
    var cardRows = content.querySelectorAll('[data-tv-nav]');
    var seenRows = {};
    
    for (var i = 0; i < cardRows.length; i++) {
      var row = cardRows[i].getAttribute('data-row');
      if (row !== 'hero' && !seenRows[row]) {
        seenRows[row] = true;
        rows.push(row);
      }
    }
  }
  
  return rows;
}

// Manejo de teclado para TV
document.addEventListener('keydown', function(e) {
  if (deviceMode !== 'tv') return;
  
  var tvApp = document.getElementById('appTV');
  if (!tvApp || tvApp.className.indexOf('active') === -1) return;
  
  var key = e.key;
  
  var controlKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' ', 'Escape', 'Backspace'];
  if (controlKeys.indexOf(key) !== -1) {
    e.preventDefault();
  }
  
  if (key === 'Escape' || key === 'Backspace') {
    var playerOverlay = document.getElementById('tvPlayerOverlay');
    var searchScreen = document.getElementById('tvSearchScreen');
    
    if (playerOverlay.className.indexOf('active') !== -1) {
      tvClosePlayer();
    } else if (searchScreen.className.indexOf('active') !== -1) {
      tvShowSection('home');
    }
    return;
  }
  
  if (key === 'Enter' || key === ' ') {
    var focused = document.querySelector('.tv-focused');
    if (focused) focused.click();
    return;
  }
  
  var directionMap = {
    'ArrowUp': 'up',
    'ArrowDown': 'down',
    'ArrowLeft': 'left',
    'ArrowRight': 'right'
  };
  
  if (directionMap[key]) {
    tvMove(directionMap[key]);
  }
});
