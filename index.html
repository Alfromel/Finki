<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Finki Stream — Premium</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
/* ======================================================================
   TOKENS — shared design system
   ====================================================================== */
:root{
  --primary:#E50914;
  --primary-glow: rgba(229,9,20,.45);
  --bg:#0a0a0f;
  --surface:#15151d;
  --surface-2:#1c1c26;
  --text:#f5f5f7;
  --text-dim:#a7a7b3;
  --text-faint:#6b6b78;
  --gold:#f2c14e;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 8px;
  --ease: cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html,body{min-height:100%;background:#000;color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
img{-webkit-user-drag:none;}
button{font-family:inherit;}
::selection{background:var(--primary);color:#fff;}

/* ======================================================================
   AUTH SCREEN — shared between both experiences
   ====================================================================== */
.auth-screen{position:fixed;inset:0;background:
  radial-gradient(ellipse 80% 60% at 20% 0%, rgba(229,9,20,.18), transparent 60%),
  radial-gradient(ellipse 70% 60% at 100% 100%, rgba(80,40,180,.16), transparent 60%),
  #08080c;
  display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;}
.auth-container{background:rgba(18,18,26,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:24px;padding:44px 32px;max-width:400px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08);}
.auth-logo{text-align:center;font-size:2.6rem;font-weight:900;background:linear-gradient(135deg,#E50914,#ff5f6d 60%,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;letter-spacing:-2px;}
.auth-sub{text-align:center;color:var(--text-faint);font-size:.8rem;margin-bottom:28px;letter-spacing:.06em;text-transform:uppercase;}
.auth-tabs{display:flex;margin-bottom:24px;background:rgba(255,255,255,.04);border-radius:14px;padding:4px;}
.auth-tab{flex:1;padding:12px;text-align:center;color:#999;border:none;background:transparent;border-radius:11px;font-weight:600;cursor:pointer;transition:.25s var(--ease);font-size:.92rem;}
.auth-tab.active{background:var(--primary);color:#fff;box-shadow:0 6px 18px var(--primary-glow);}
.input-group{position:relative;margin-bottom:14px;}
.input-group i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#666;font-size:.9rem;}
.input-group input{width:100%;padding:15px 16px 15px 46px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:13px;color:#fff;font-size:.98rem;transition:.25s var(--ease);outline:none;}
.input-group input:focus{border-color:var(--primary);background:rgba(255,255,255,.1);box-shadow:0 0 0 4px var(--primary-glow);}
.btn-submit{width:100%;padding:16px;background:var(--primary);color:#fff;border:none;border-radius:13px;font-size:1.02rem;font-weight:700;cursor:pointer;margin-top:16px;transition:.2s var(--ease);letter-spacing:.02em;}
.btn-submit:active{transform:scale(.98);background:#c70812;}
.error-msg{color:#ff8080;font-size:.83rem;margin-top:6px;display:none;padding:9px 10px;background:rgba(255,107,107,.1);border-radius:9px;}

/* ======================================================================
   ROOT APP WRAPPER
   ====================================================================== */
.app{display:none;background:#000;}
.app.active{display:block;}

/* ############################################################
   #############   MOBILE EXPERIENCE   ##########################
   ############################################################ */
#appMobile.active{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}

/* --- status-bar aware header --- */
.m-header{position:fixed;top:0;left:0;right:0;z-index:100;padding:calc(12px + var(--safe-t)) 18px 14px;display:flex;align-items:center;justify-content:space-between;transition:background .3s var(--ease), backdrop-filter .3s var(--ease);}
.m-header.scrolled{background:rgba(8,8,12,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06);}
.m-logo{font-size:1.6rem;font-weight:900;background:linear-gradient(135deg,#E50914,#ff5f6d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px;}
.m-header-right{display:flex;gap:10px;align-items:center;}
.m-icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.06);color:#fff;font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;}
.m-icon-btn:active{transform:scale(.9);background:rgba(255,255,255,.16);}
.m-avatar{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#ff4444);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;cursor:pointer;border:2px solid rgba(255,255,255,.18);}

/* --- content scroll --- */
.m-content{flex:1 0 auto;padding-bottom:calc(96px + var(--safe-b));}

/* --- hero carousel --- */
.m-hero{position:relative;height:62vh;min-height:380px;overflow:hidden;transition:background 1s ease;}
.m-hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease-in-out;background-size:cover;background-position:center;transform:scale(1.02);}
.m-hero-slide.active{opacity:1;}
.m-hero-gradient{position:absolute;inset:0;background:linear-gradient(to top,#000 0%,rgba(0,0,0,.25) 45%,rgba(0,0,0,.55) 100%);z-index:1;}
.m-hero-gradient::after{content:'';position:absolute;top:0;left:0;right:0;height:140px;background:linear-gradient(to bottom, rgba(0,0,0,.55), transparent);}
.m-hero-content{position:absolute;bottom:8%;left:6%;right:6%;z-index:2;}
.m-hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(229,9,20,.9);color:#fff;font-size:.68rem;font-weight:800;letter-spacing:.08em;padding:5px 11px;border-radius:20px;margin-bottom:12px;text-transform:uppercase;}
.m-hero-title{font-size:clamp(1.7rem,7vw,2.6rem);font-weight:900;margin-bottom:8px;text-shadow:2px 3px 10px rgba(0,0,0,.9);line-height:1.08;}
.m-hero-meta{font-size:.92rem;color:#e2e2e6;margin-bottom:18px;text-shadow:1px 2px 6px rgba(0,0,0,.9);display:flex;align-items:center;gap:8px;}
.m-hero-buttons{display:flex;gap:10px;}
.m-btn-hero{padding:13px 22px;border-radius:12px;font-weight:700;font-size:.95rem;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s;flex:1;justify-content:center;}
.m-btn-hero:active{transform:scale(.95);}
.m-btn-play{background:#fff;color:#000;}
.m-btn-list{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);flex:0 0 auto;width:52px;padding:13px;}
.m-hero-progress{position:absolute;bottom:1.5%;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3;}
.m-progress-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:.3s;}
.m-progress-dot.active{background:var(--primary);width:20px;border-radius:4px;}

/* --- rows / cards --- */
.m-row{margin-bottom:26px;padding-left:5%;}
.m-row-header{font-size:1.12rem;font-weight:800;margin-bottom:12px;color:#ececef;padding-right:5%;display:flex;align-items:center;gap:8px;}
.m-slider{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px;padding-right:5%;}
.m-slider::-webkit-scrollbar{display:none;}
.m-card{flex:0 0 auto;width:42vw;max-width:190px;cursor:pointer;scroll-snap-align:start;border-radius:12px;overflow:hidden;position:relative;transition:transform .2s var(--ease);background:var(--surface);}
.m-card:active{transform:scale(.95);}
.m-card-img-wrap{position:relative;width:100%;aspect-ratio:2/3;background:var(--surface-2);overflow:hidden;}
.m-row.m-row-wide .m-card{width:70vw;max-width:320px;}
.m-row.m-row-wide .m-card-img-wrap{aspect-ratio:16/9;}
.m-card-img{width:100%;height:100%;object-fit:cover;}
.m-card-overlay{position:absolute;bottom:0;left:0;right:0;padding:26px 10px 10px;background:linear-gradient(to top,rgba(0,0,0,.92),transparent);}
.m-card-title{font-weight:700;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.m-card-meta{font-size:.7rem;color:#aaa;margin-top:2px;}
.m-card-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff;font-size:.6rem;font-weight:800;padding:4px 8px;border-radius:6px;text-transform:uppercase;z-index:2;letter-spacing:.03em;border:1px solid rgba(255,255,255,.12);}
.m-card-badge.live{background:var(--primary);border-color:transparent;}
.m-card-list-btn{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);border:1.5px solid rgba(255,255,255,.35);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;transition:.2s;font-size:.72rem;}
.m-card-list-btn.in-list{background:var(--primary);border-color:var(--primary);}

/* --- category grid sections --- */
.m-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:18px 5% 20px;padding-top:calc(90px + var(--safe-t));}
.m-grid .m-card{width:100%;max-width:none;}
.m-section-title{font-size:1.4rem;font-weight:800;margin-bottom:4px;grid-column:1/-1;display:flex;align-items:center;gap:10px;}
.m-empty{color:var(--text-faint);grid-column:1/-1;text-align:center;padding:60px 20px;font-size:.9rem;}
.m-empty i{display:block;font-size:2rem;margin-bottom:12px;opacity:.5;}

/* --- floating bottom nav (pill / glass) --- */
.m-nav-bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px max(8px, calc(var(--safe-b) + 2px));z-index:100;pointer-events:none;}
.m-nav{pointer-events:auto;display:flex;gap:2px;background:rgba(24,24,32,.82);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);}
.m-nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8a8a94;background:none;border:none;font-size:.6rem;font-weight:600;cursor:pointer;padding:9px 15px;border-radius:20px;transition:.25s var(--ease);position:relative;min-width:58px;}
.m-nav-item i{font-size:1.15rem;transition:.25s var(--ease);}
.m-nav-item.active{color:#fff;background:var(--primary);box-shadow:0 6px 16px var(--primary-glow);}
.m-nav-item.active i{transform:translateY(-1px);}
.m-nav-item span{max-height:0;opacity:0;overflow:hidden;transition:.25s var(--ease);}
.m-nav-item.active span{max-height:14px;opacity:1;margin-top:1px;}

/* --- search --- */
.m-search-screen{position:fixed;inset:0;background:#050508;z-index:200;display:none;flex-direction:column;padding:16px 18px;padding-top:calc(16px + var(--safe-t));overflow-y:auto;}
.m-search-screen.active{display:flex;}
.m-search-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.m-search-back{background:rgba(255,255,255,.08);border:none;color:#fff;font-size:1rem;cursor:pointer;padding:11px 13px;border-radius:12px;}
.m-search-input-wrap{flex:1;display:flex;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:0 14px;}
.m-search-input-wrap input{flex:1;padding:13px 0;background:transparent;border:none;color:#fff;font-size:.95rem;outline:none;}
.m-filters{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;}
.m-filters::-webkit-scrollbar{display:none;}
.m-chip{padding:8px 18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:20px;color:#ddd;font-size:.8rem;cursor:pointer;transition:.2s;white-space:nowrap;font-weight:600;}
.m-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.m-search-results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.m-search-results .m-card{width:100%;max-width:none;}

/* --- profile drawer --- */
.m-profile-panel{position:fixed;top:0;right:-100%;width:82%;max-width:340px;height:100%;background:rgba(10,10,14,.98);backdrop-filter:blur(24px);z-index:300;transition:right .35s var(--ease);padding:calc(28px + var(--safe-t)) 22px 22px;border-left:1px solid rgba(255,255,255,.08);}
.m-profile-panel.open{right:0;}
.m-panel-close{position:absolute;top:calc(20px + var(--safe-t));right:20px;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:1.1rem;cursor:pointer;padding:9px 11px;border-radius:10px;}
.m-panel-item{display:flex;align-items:center;gap:15px;padding:16px 4px;color:#ccc;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;font-size:.94rem;font-weight:600;transition:.2s;}
.m-panel-item:active{color:#fff;background:rgba(255,255,255,.04);}
.m-panel-item i{width:20px;color:var(--primary);font-size:1rem;}

/* --- mobile player --- */
.m-player-overlay{position:fixed;inset:0;background:#000;z-index:9999;display:none;}
.m-player-overlay.active{display:block;}
.m-player-frame{width:100%;height:100%;border:none;}
.m-close-player{position:absolute;top:calc(18px + var(--safe-t));right:18px;background:rgba(0,0,0,.65);border:1.5px solid rgba(255,255,255,.3);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;font-size:.95rem;}

/* ############################################################
   #############   TV EXPERIENCE   ###############################
   ############################################################ */
#appTV.active{display:flex;flex-direction:column;height:100vh;height:100dvh;}
.tv-body{display:flex;flex:1;position:relative;overflow:hidden;}

/* --- left icon rail navigation (remote-first) --- */
.tv-rail{width:84px;flex:0 0 84px;background:linear-gradient(180deg,rgba(8,8,12,.95),rgba(8,8,12,.85));display:flex;flex-direction:column;align-items:center;padding:28px 0;gap:6px;position:relative;z-index:50;transition:width .25s var(--ease);border-right:1px solid rgba(255,255,255,.05);}
.tv-rail.expanded{width:230px;align-items:flex-start;padding-left:18px;}
.tv-rail-logo{font-size:1.5rem;font-weight:900;background:linear-gradient(135deg,#E50914,#ff5f6d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:36px;letter-spacing:-1px;}
.tv-rail-item{display:flex;align-items:center;gap:14px;width:56px;height:56px;border-radius:16px;color:#8a8a94;background:transparent;border:2px solid transparent;cursor:pointer;transition:.2s var(--ease);position:relative;font-size:1.25rem;flex:0 0 auto;}
.tv-rail.expanded .tv-rail-item{width:100%;padding-left:16px;justify-content:flex-start;}
.tv-rail-item span{white-space:nowrap;opacity:0;max-width:0;overflow:hidden;transition:.2s var(--ease);font-size:.92rem;font-weight:700;}
.tv-rail.expanded .tv-rail-item span{opacity:1;max-width:140px;}
.tv-rail-item.active{color:#fff;background:rgba(229,9,20,.16);}
.tv-rail-item.tv-focused{color:#fff;border-color:var(--primary);background:rgba(229,9,20,.22);box-shadow:0 0 0 5px var(--primary-glow);transform:scale(1.06);}
.tv-rail-item i{width:22px;text-align:center;flex:0 0 auto;justify-content:center;display:flex;}
.tv-rail:not(.expanded) .tv-rail-item{justify-content:center;}
.tv-rail-avatar{margin-top:auto;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#ff4444);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1.1rem;border:2px solid transparent;cursor:pointer;flex:0 0 auto;}
.tv-rail-avatar.tv-focused{border-color:var(--primary);box-shadow:0 0 0 5px var(--primary-glow);transform:scale(1.08);}

/* --- content --- */
.tv-content{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:60px;}
.tv-content::-webkit-scrollbar{display:none;}

/* --- hero --- */
.tv-hero{position:relative;height:78vh;min-height:520px;overflow:hidden;transition:background 1s ease;}
.tv-hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease-in-out;background-size:cover;background-position:center;}
.tv-hero-slide.active{opacity:1;}
.tv-hero-gradient{position:absolute;inset:0;background:linear-gradient(to top,#000 0%,rgba(0,0,0,.15) 42%,rgba(0,0,0,.55) 100%),linear-gradient(to right, rgba(0,0,0,.75) 0%, transparent 55%);z-index:1;}
.tv-hero-content{position:absolute;bottom:14%;left:6%;max-width:640px;z-index:2;}
.tv-hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(229,9,20,.92);color:#fff;font-size:.78rem;font-weight:800;letter-spacing:.1em;padding:6px 14px;border-radius:20px;margin-bottom:16px;text-transform:uppercase;}
.tv-hero-title{font-size:clamp(2.4rem,4.4vw,4rem);font-weight:900;margin-bottom:14px;text-shadow:3px 4px 14px rgba(0,0,0,.9);line-height:1.05;}
.tv-hero-meta{font-size:1.1rem;color:#dcdce0;margin-bottom:28px;text-shadow:2px 2px 8px rgba(0,0,0,.9);}
.tv-hero-buttons{display:flex;gap:16px;}
.tv-btn-hero{padding:16px 34px;border-radius:12px;font-weight:800;font-size:1.08rem;border:3px solid transparent;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.2s var(--ease);}
.tv-btn-play{background:#fff;color:#000;}
.tv-btn-list{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(10px);border-color:rgba(255,255,255,.2);}
.tv-btn-hero.tv-focused{transform:scale(1.08);border-color:var(--primary);box-shadow:0 0 0 6px var(--primary-glow);}
.tv-hero-progress{position:absolute;bottom:6%;left:6%;display:flex;gap:8px;z-index:3;}
.tv-progress-dot{width:34px;height:4px;border-radius:3px;background:rgba(255,255,255,.28);transition:.3s;}
.tv-progress-dot.active{background:var(--primary);}

/* --- rows --- */
.tv-row{margin:0 0 44px;padding-left:6%;}
.tv-row-header{font-size:1.5rem;font-weight:800;margin-bottom:18px;color:#ececef;padding-right:6%;display:flex;align-items:center;gap:10px;}
.tv-slider{display:flex;gap:18px;overflow-x:visible;padding-right:6%;padding-bottom:6px;transition:transform .35s var(--ease);will-change:transform;}
.tv-card{flex:0 0 auto;width:230px;cursor:pointer;border-radius:14px;overflow:hidden;position:relative;transition:transform .25s var(--ease),box-shadow .25s var(--ease);background:var(--surface);border:3px solid transparent;}
.tv-row.tv-row-wide .tv-card{width:340px;}
.tv-card.tv-focused{transform:scale(1.12);z-index:20;border-color:var(--primary);box-shadow:0 20px 50px rgba(0,0,0,.7),0 0 0 6px var(--primary-glow);}
.tv-card-img-wrap{position:relative;width:100%;aspect-ratio:2/3;background:var(--surface-2);overflow:hidden;}
.tv-row.tv-row-wide .tv-card-img-wrap{aspect-ratio:16/9;}
.tv-card-img{width:100%;height:100%;object-fit:cover;}
.tv-card-overlay{position:absolute;bottom:0;left:0;right:0;padding:34px 12px 12px;background:linear-gradient(to top,rgba(0,0,0,.94),transparent);opacity:0;transition:.25s;}
.tv-card.tv-focused .tv-card-overlay{opacity:1;}
.tv-card-title{font-weight:800;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tv-card-meta{font-size:.78rem;color:#bbb;margin-top:3px;}
.tv-card-badge{position:absolute;top:9px;left:9px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);color:#fff;font-size:.66rem;font-weight:800;padding:4px 9px;border-radius:6px;text-transform:uppercase;z-index:2;border:1px solid rgba(255,255,255,.14);}
.tv-card-badge.live{background:var(--primary);border-color:transparent;}
.tv-play-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);opacity:0;transition:.2s;font-size:2.2rem;color:#fff;}
.tv-card.tv-focused .tv-play-hint{opacity:1;}

/* --- grid sections --- */
.tv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px;padding:70px 6% 30px;}
.tv-grid .tv-card{width:100%;}
.tv-section-title{font-size:2rem;font-weight:800;margin-bottom:6px;grid-column:1/-1;}
.tv-empty{color:var(--text-faint);grid-column:1/-1;text-align:center;padding:80px 20px;font-size:1.05rem;}
.tv-empty i{display:block;font-size:2.6rem;margin-bottom:16px;opacity:.5;}

/* --- TV search --- */
.tv-search-screen{position:fixed;inset:0;background:rgba(5,5,8,.98);z-index:200;display:none;flex-direction:column;padding:50px 6%;overflow-y:auto;}
.tv-search-screen.active{display:flex;}
.tv-search-input-wrap{display:flex;align-items:center;background:rgba(255,255,255,.08);border:3px solid transparent;border-radius:16px;padding:0 22px;max-width:640px;margin-bottom:24px;}
.tv-search-input-wrap.tv-focused{border-color:var(--primary);box-shadow:0 0 0 6px var(--primary-glow);}
.tv-search-input-wrap input{flex:1;padding:20px 0;background:transparent;border:none;color:#fff;font-size:1.3rem;outline:none;}
.tv-filters{display:flex;gap:18px;margin-bottom:34px;}
.tv-chip{padding:17px 46px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.08);border-radius:28px;color:#ddd;font-size:1.15rem;cursor:pointer;font-weight:700;white-space:nowrap;line-height:1.3;transition:.2s var(--ease);min-width:130px;text-align:center;}
.tv-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.tv-chip.tv-focused{border-color:#fff;transform:scale(1.08);box-shadow:0 8px 24px rgba(0,0,0,.4);}
.tv-search-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;}

/* --- TV player --- */
.tv-player-overlay{position:fixed;inset:0;background:#000;z-index:9999;display:none;}
.tv-player-overlay.active{display:block;}
.tv-player-frame{width:100%;height:100%;border:none;}
.tv-close-player{position:absolute;top:26px;right:26px;background:rgba(0,0,0,.7);border:3px solid rgba(255,255,255,.3);color:#fff;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;z-index:10;}
.tv-close-player.tv-focused{border-color:var(--primary);box-shadow:0 0 0 6px var(--primary-glow);}

/* --- remote control hint bar --- */
.tv-remote-hints{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:34px;padding:14px 20px;background:linear-gradient(to top, rgba(0,0,0,.85), transparent);z-index:60;pointer-events:none;font-size:.85rem;color:#bbb;}
.tv-remote-hints span{display:flex;align-items:center;gap:8px;}
.tv-key{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-weight:700;font-size:.75rem;}

/* --- shared focus utility --- */
[tabindex]{outline:none;}
</style>
</head>
<body>

<!-- ============================================================
     AUTH SCREEN (shared)
     ============================================================ -->
<div class="auth-screen" id="authScreen">
  <div class="auth-container">
    <div class="auth-logo">FINKI</div>
    <div class="auth-sub">Streaming premium</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuth('login')">Iniciar sesión</button>
      <button class="auth-tab" onclick="switchAuth('register')">Registrarse</button>
    </div>
    <form id="loginForm">
      <div class="input-group"><i class="fas fa-mobile-alt"></i><input type="tel" id="loginPhone" placeholder="Celular (8 dígitos)" maxlength="8" inputmode="numeric"></div>
      <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="loginPass" placeholder="Contraseña"></div>
      <div class="error-msg" id="loginError"></div>
      <button type="submit" class="btn-submit">Iniciar sesión</button>
    </form>
    <form id="registerForm" style="display:none;">
      <div class="input-group"><i class="fas fa-user"></i><input type="text" id="regName" placeholder="Nombre completo"></div>
      <div class="input-group"><i class="fas fa-calendar"></i><input type="number" id="regAge" placeholder="Edad" min="1" max="120"></div>
      <div class="input-group"><i class="fas fa-mobile-alt"></i><input type="tel" id="regPhone" placeholder="Celular (8 dígitos)" maxlength="8"></div>
      <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="regPass" placeholder="Contraseña"></div>
      <div class="error-msg" id="registerError"></div>
      <button type="submit" class="btn-submit">Crear cuenta</button>
    </form>
  </div>
</div>

<!-- ============================================================
     MOBILE APP
     ============================================================ -->
<div class="app" id="appMobile">
  <header class="m-header" id="mHeader">
    <div class="m-logo">FINKI</div>
    <div class="m-header-right">
      <button class="m-icon-btn" onclick="mOpenSearch()"><i class="fas fa-search"></i></button>
      <div class="m-avatar" id="mAvatar" onclick="mToggleProfile()">U</div>
    </div>
  </header>

  <div class="m-content" id="mContent"></div>

  <div class="m-nav-bar">
    <nav class="m-nav" id="mNav">
      <button class="m-nav-item active" data-section="home"><i class="fas fa-house"></i><span>Inicio</span></button>
      <button class="m-nav-item" data-section="movies"><i class="fas fa-film"></i><span>Películas</span></button>
      <button class="m-nav-item" data-section="series"><i class="fas fa-tv"></i><span>Series</span></button>
      <button class="m-nav-item" data-section="channels"><i class="fas fa-satellite-dish"></i><span>Canales</span></button>
      <button class="m-nav-item" data-section="mylist"><i class="fas fa-bookmark"></i><span>Mi lista</span></button>
    </nav>
  </div>
</div>

<div class="m-search-screen" id="mSearchScreen">
  <div class="m-search-header">
    <button class="m-search-back" onclick="mCloseSearch()"><i class="fas fa-arrow-left"></i></button>
    <div class="m-search-input-wrap">
      <i class="fas fa-search" style="color:#888;margin-right:10px;"></i>
      <input type="text" id="mSearchInput" placeholder="Buscar contenido..." autocomplete="off">
      <i class="fas fa-xmark" style="color:#888;cursor:pointer;" onclick="mClearSearch()"></i>
    </div>
  </div>
  <div class="m-filters" id="mSearchFilters">
    <button class="m-chip active" data-filter="all">Todos</button>
    <button class="m-chip" data-filter="pelicula">Películas</button>
    <button class="m-chip" data-filter="serie">Series</button>
    <button class="m-chip" data-filter="canal">Canales</button>
  </div>
  <div class="m-search-results" id="mSearchResults"></div>
</div>

<div class="m-player-overlay" id="mPlayerOverlay">
  <button class="m-close-player" onclick="mClosePlayer()"><i class="fas fa-xmark"></i></button>
  <iframe class="m-player-frame" id="mPlayerFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>

<div class="m-profile-panel" id="mProfilePanel">
  <button class="m-panel-close" onclick="mToggleProfile()"><i class="fas fa-xmark"></i></button>
  <div style="display:flex;align-items:center;gap:14px;margin:20px 0 28px;">
    <div class="m-avatar" style="width:50px;height:50px;font-size:1.15rem;" id="mPanelAvatar">U</div>
    <div>
      <div style="font-weight:800;font-size:1.08rem;" id="mPanelName">Usuario</div>
      <div style="color:#999;font-size:.82rem;" id="mPanelPhone">Celular</div>
    </div>
  </div>
  <div class="m-panel-item" onclick="mShowSection('mylist');mToggleProfile();"><i class="fas fa-bookmark"></i> Mi lista</div>
  <div class="m-panel-item" onclick="mShowSection('history');mToggleProfile();"><i class="fas fa-clock-rotate-left"></i> Historial</div>
  <div class="m-panel-item" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Cerrar sesión</div>
</div>

<!-- ============================================================
     TV APP
     ============================================================ -->
<div class="app" id="appTV">
  <div class="tv-body">
    <nav class="tv-rail" id="tvRail">
      <div class="tv-rail-logo">F</div>
      <button class="tv-rail-item active" data-section="home" data-tv-nav data-row="rail" data-col="0"><i class="fas fa-house"></i><span>Inicio</span></button>
      <button class="tv-rail-item" data-section="search" data-tv-nav data-row="rail" data-col="1"><i class="fas fa-search"></i><span>Buscar</span></button>
      <button class="tv-rail-item" data-section="movies" data-tv-nav data-row="rail" data-col="2"><i class="fas fa-film"></i><span>Películas</span></button>
      <button class="tv-rail-item" data-section="series" data-tv-nav data-row="rail" data-col="3"><i class="fas fa-tv"></i><span>Series</span></button>
      <button class="tv-rail-item" data-section="channels" data-tv-nav data-row="rail" data-col="4"><i class="fas fa-satellite-dish"></i><span>Canales</span></button>
      <button class="tv-rail-item" data-section="mylist" data-tv-nav data-row="rail" data-col="5"><i class="fas fa-bookmark"></i><span>Mi lista</span></button>
      <div class="tv-rail-avatar" id="tvAvatar" data-tv-nav data-row="rail" data-col="6" onclick="logout()">U</div>
    </nav>
    <div class="tv-content" id="tvContent"></div>
  </div>

  <div class="tv-search-screen" id="tvSearchScreen">
    <div class="tv-search-input-wrap" id="tvSearchWrap" data-tv-nav data-row="search-input" data-col="0">
      <i class="fas fa-search" style="color:#888;margin-right:14px;font-size:1.2rem;"></i>
      <input type="text" id="tvSearchInput" placeholder="Buscar contenido..." autocomplete="off" readonly>
    </div>
    <div class="tv-filters" id="tvSearchFilters">
      <button class="tv-chip active" data-filter="all" data-tv-nav data-row="search-filters" data-col="0">Todos</button>
      <button class="tv-chip" data-filter="pelicula" data-tv-nav data-row="search-filters" data-col="1">Películas</button>
      <button class="tv-chip" data-filter="serie" data-tv-nav data-row="search-filters" data-col="2">Series</button>
      <button class="tv-chip" data-filter="canal" data-tv-nav data-row="search-filters" data-col="3">Canales</button>
    </div>
    <div class="tv-search-results" id="tvSearchResults"></div>
  </div>

  <div class="tv-player-overlay" id="tvPlayerOverlay">
    <button class="tv-close-player" id="tvClosePlayerBtn" data-tv-nav data-row="player" data-col="0" onclick="tvClosePlayer()"><i class="fas fa-xmark"></i></button>
    <iframe class="tv-player-frame" id="tvPlayerFrame" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>

  <div class="tv-remote-hints" id="tvRemoteHints">
    <span><i class="tv-key">↑↓←→</i> Navegar</span>
    <span><i class="tv-key">OK</i> Seleccionar</span>
    <span><i class="tv-key">⌫</i> Volver</span>
  </div>
</div>

<script>
/* ==========================================================================
   SHARED CONFIG + DATA LAYER
   ========================================================================== */
const SUPABASE_URL = 'https://rojsndimvyjzgstxivqo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_djOXqhg8VILB9fwLLFkNlg_xjWvBqEh';
const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let allContent = [];
let myList = [];
let history = [];
let heroContent = [];
let deviceMode = 'mobile'; // 'mobile' | 'tv'

/* ==========================================================================
   DEVICE DETECTION
   ========================================================================== */
function detectDevice(){
  const forced = localStorage.getItem('finki_force_mode');
  if (forced === 'tv' || forced === 'mobile') return forced;
  const ua = navigator.userAgent || '';
  const tvUA = /SmartTV|SMART-TV|Tizen|WebOS|Web0S|GoogleTV|HbbTV|NetCast|VIDAA|BRAVIA|AFT[A-Z]?[0-9]?|CrKey|Roku|POV_TV|AQUOS/i.test(ua);
  const hasTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const wide = window.innerWidth >= 1150;
  if (tvUA) return 'tv';
  if (wide && !hasTouch) return 'tv';
  return 'mobile';
}

function applyDeviceMode(){
  deviceMode = detectDevice();
  document.getElementById('appMobile').classList.toggle('active', deviceMode === 'mobile' && !!currentUser);
  document.getElementById('appTV').classList.toggle('active', deviceMode === 'tv' && !!currentUser);
  document.body.classList.toggle('is-mobile', deviceMode === 'mobile');
  document.body.classList.toggle('is-tv', deviceMode === 'tv');
}

// Manual override for testing: triple-tap/click the auth logo cycles mode.
(function setupModeSwitcher(){
  let taps = 0, timer = null;
  document.addEventListener('click', (e) => {
    const el = e.target.closest('.auth-logo, .m-logo, .tv-rail-logo');
    if (!el) return;
    taps++;
    clearTimeout(timer);
    timer = setTimeout(() => { taps = 0; }, 900);
    if (taps >= 3) {
      taps = 0;
      const cur = localStorage.getItem('finki_force_mode') || detectDevice();
      const next = cur === 'tv' ? 'mobile' : 'tv';
      localStorage.setItem('finki_force_mode', next);
      location.reload();
    }
  });
})();

/* ==========================================================================
   AUTH
   ========================================================================== */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const phone = document.getElementById('loginPhone').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  if (!/^\d{8}$/.test(phone)) { errEl.style.display='block'; errEl.textContent='El celular debe tener 8 dígitos'; return; }
  errEl.style.display = 'none';
  const { data, error } = await supabaseClient.from('users').select('*').eq('celular', phone).eq('password', pass).single();
  if (error || !data) { errEl.style.display='block'; errEl.textContent='Credenciales incorrectas'; return; }
  loginUser(data);
});

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const age = document.getElementById('regAge').value;
  const phone = document.getElementById('regPhone').value.trim();
  const pass = document.getElementById('regPass').value;
  const errEl = document.getElementById('registerError');
  if (!name || !age || !phone || !pass) { errEl.style.display='block'; errEl.textContent='Todos los campos son obligatorios'; return; }
  if (!/^\d{8}$/.test(phone)) { errEl.style.display='block'; errEl.textContent='Celular debe tener 8 dígitos'; return; }
  errEl.style.display = 'none';
  const { data: exist } = await supabaseClient.from('users').select('celular').eq('celular', phone).single();
  if (exist) { errEl.style.display='block'; errEl.textContent='Este celular ya está registrado'; return; }
  const { data, error } = await supabaseClient.from('users').insert([{ nombre:name, edad:parseInt(age), celular:phone, password:pass }]).select();
  if (error) { errEl.style.display='block'; errEl.textContent='Error al registrar'; return; }
  loginUser(data[0]);
});

function loginUser(user){
  currentUser = user;
  localStorage.setItem('finki_user', JSON.stringify(user));
  document.getElementById('authScreen').style.display = 'none';
  applyDeviceMode();
  updateProfileUI();
  loadUserData();
  fetchContent();
}

function logout(){ localStorage.removeItem('finki_user'); location.reload(); }

function switchAuth(tab){
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.auth-tab[onclick*="${tab}"]`).classList.add('active');
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
}

function updateProfileUI(){
  if (!currentUser) return;
  const initial = currentUser.nombre.charAt(0).toUpperCase();
  const mAv = document.getElementById('mAvatar'); if (mAv) mAv.textContent = initial;
  const mPAv = document.getElementById('mPanelAvatar'); if (mPAv) mPAv.textContent = initial;
  const mPName = document.getElementById('mPanelName'); if (mPName) mPName.textContent = currentUser.nombre;
  const mPPhone = document.getElementById('mPanelPhone'); if (mPPhone) mPPhone.textContent = currentUser.celular;
  const tvAv = document.getElementById('tvAvatar'); if (tvAv) tvAv.textContent = initial;
}

function loadUserData(){
  if (!currentUser) return;
  const base = `finki_${currentUser.id}`;
  myList = JSON.parse(localStorage.getItem(`${base}_mylist`) || '[]');
  history = JSON.parse(localStorage.getItem(`${base}_history`) || '[]');
}
function saveList(){ if (currentUser) localStorage.setItem(`finki_${currentUser.id}_mylist`, JSON.stringify(myList)); }
function saveHistory(){ if (currentUser) localStorage.setItem(`finki_${currentUser.id}_history`, JSON.stringify(history)); }

function escapeHtml(str){ if (!str) return ''; return str.replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
const PLACEHOLDER_IMG = 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 150%22><rect fill=%22%231c1c26%22 width=%22100%22 height=%22150%22/></svg>';

/* ==========================================================================
   CONTENT FETCH (shared)
   ========================================================================== */
async function fetchContent(){
  const { data, error } = await supabaseClient.from('contenido').select('*, categorias(nombre)').order('fecha_agregado', { ascending:false });
  if (error) { console.error('Error fetching content:', error); return; }
  allContent = data || [];
  if (allContent.length > 0) heroContent = allContent.slice(0,5);
  if (deviceMode === 'mobile') mShowSection('home'); else tvShowSection('home');
}

function addToHistory(item){
  history = history.filter(i => i.id !== item.id);
  history.unshift({ id:item.id, nombre:item.nombre, url_contenido:item.url_contenido, tipo:item.tipo, url_portada:item.url_portada });
  if (history.length > 30) history.pop();
  saveHistory();
}

function toggleList(contentId){
  const item = allContent.find(i => i.id === contentId);
  if (!item) return;
  const idx = myList.findIndex(i => i.id === contentId);
  if (idx === -1) myList.push({ id:item.id, nombre:item.nombre, url_contenido:item.url_contenido, url_portada:item.url_portada, tipo:item.tipo });
  else myList.splice(idx,1);
  saveList();
  if (deviceMode === 'mobile') mShowSection(mCurrentSection); else tvShowSection(tvCurrentSection);
}

/* ##########################################################################
   ####################   MOBILE ENGINE   ####################################
   ########################################################################## */
let mCurrentSection = 'home';
let mCurrentHeroIndex = 0;
let mHeroInterval = null;

window.addEventListener('scroll', function(){
  if (deviceMode !== 'mobile') return;
  document.getElementById('mHeader')?.classList.toggle('scrolled', window.scrollY > 30);
}, { passive:true });

function mShowSection(section){
  mCurrentSection = section;
  if (section !== 'home') mStopHeroRotation();
  document.querySelectorAll('.m-nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.m-nav-item[data-section="${section}"]`)?.classList.add('active');
  const c = document.getElementById('mContent');
  switch(section){
    case 'home': mRenderHome(); break;
    case 'movies': mRenderCategory('pelicula','🎬 Películas','fa-film'); break;
    case 'series': mRenderCategory('serie','📺 Series','fa-tv'); break;
    case 'channels': mRenderCategory('canal','📡 Canales en vivo','fa-satellite-dish'); break;
    case 'mylist': mRenderList(myList,'📌 Mi lista','fa-bookmark','Tu lista está vacía'); break;
    case 'history': mRenderList(history,'🕐 Historial','fa-clock-rotate-left','No hay historial'); break;
  }
  window.scrollTo({ top:0, behavior:'auto' });
}

function mRenderHome(){
  const c = document.getElementById('mContent');
  let html = '';
  if (heroContent.length > 0){
    html += `<div class="m-hero" id="mHero">
      ${heroContent.map((item,i)=>`<div class="m-hero-slide ${i===0?'active':''}" style="background-image:url('${item.url_portada||''}')" data-index="${i}"></div>`).join('')}
      <div class="m-hero-gradient"></div>
      <div class="m-hero-content">
        <span class="m-hero-badge"><i class="fas fa-star"></i> Destacado</span>
        <h1 class="m-hero-title" id="mHeroTitle">${heroContent[0].nombre}</h1>
        <p class="m-hero-meta" id="mHeroMeta"><i class="fas fa-tag"></i> ${heroContent[0].categorias?.nombre || 'Contenido exclusivo'}</p>
        <div class="m-hero-buttons">
          <button class="m-btn-hero m-btn-play" onclick="mPlayHero()"><i class="fas fa-play"></i> Reproducir</button>
          <button class="m-btn-hero m-btn-list" onclick="mAddHeroToList()"><i class="fas fa-plus"></i></button>
        </div>
      </div>
      <div class="m-hero-progress" id="mHeroProgress">
        ${heroContent.map((_,i)=>`<div class="m-progress-dot ${i===0?'active':''}" data-index="${i}"></div>`).join('')}
      </div>
    </div>`;
  }
  const destacados = allContent.slice(5,15);
  const peliculas = allContent.filter(i=>i.tipo==='pelicula').slice(0,10);
  const series = allContent.filter(i=>i.tipo==='serie').slice(0,10);
  const canales = allContent.filter(i=>i.tipo==='canal').slice(0,10);
  if (destacados.length) html += mRow('🔥 Destacados', destacados);
  if (peliculas.length) html += mRow('🎬 Películas', peliculas);
  if (series.length) html += mRow('📺 Series', series);
  if (canales.length) html += mRow('📡 En vivo', canales, true);
  c.innerHTML = html;
  if (heroContent.length) { mUpdateHeroBg(heroContent[0]); mStartHeroRotation(); }
}

function mRow(title, items, wide=false){
  return `<div class="m-row ${wide?'m-row-wide':''}">
    <h2 class="m-row-header">${title}</h2>
    <div class="m-slider">${items.map(mCard).join('')}</div>
  </div>`;
}

function mCard(item){
  const inList = myList.some(i=>i.id===item.id);
  const badge = item.tipo==='canal' ? 'EN VIVO' : (item.tipo==='serie' ? 'Serie' : 'Película');
  return `<div class="m-card" onclick="mPlayContent('${escapeHtml(item.url_contenido)}','${item.id}')">
    <div class="m-card-img-wrap">
      <img src="${item.url_portada||PLACEHOLDER_IMG}" class="m-card-img" loading="lazy" onerror="this.src='${PLACEHOLDER_IMG}'">
      <span class="m-card-badge ${item.tipo==='canal'?'live':''}">${badge}</span>
      <button class="m-card-list-btn ${inList?'in-list':''}" onclick="event.stopPropagation();toggleList('${item.id}')"><i class="fas ${inList?'fa-check':'fa-plus'}"></i></button>
      <div class="m-card-overlay"><div class="m-card-title">${item.nombre}</div><div class="m-card-meta">${item.categorias?.nombre||'General'}</div></div>
    </div>
  </div>`;
}

function mRenderCategory(tipo, title, icon){
  const items = allContent.filter(i=>i.tipo===tipo);
  document.getElementById('mContent').innerHTML = `<div class="m-grid">
    <h1 class="m-section-title"><i class="fas ${icon}"></i> ${title}</h1>
    ${items.length ? items.map(mCard).join('') : `<div class="m-empty"><i class="fas ${icon}"></i>No hay contenido disponible</div>`}
  </div>`;
}

function mRenderList(list, title, icon, emptyMsg){

function tvShowSection(section){
  tvCurrentSection = section;
  document.getElementById('tvSearchScreen').classList.remove('active');
  if (section !== 'home') tvStopHeroRotation();
  document.querySelectorAll('.tv-rail-item').forEach(n=>n.classList.remove('active'));
  document.querySelector(`.tv-rail-item[data-section="${section}"]`)?.classList.add('active');

  if (section === 'search'){
    document.getElementById('tvSearchScreen').classList.add('active');
    tvPerformSearch('', 'all');
    tvContext = 'search';
    tvSetFocus('search-filters', 0);
    return;
  }
  tvContext = 'home';
  const c = document.getElementById('tvContent');
  switch(section){
    case 'home': tvRenderHome(); break;
    case 'movies': tvRenderCategory('pelicula','🎬 Películas'); break;
    case 'series': tvRenderCategory('serie','📺 Series'); break;
    case 'channels': tvRenderCategory('canal','📡 Canales en vivo'); break;
    case 'mylist': tvRenderList(myList,'📌 Mi lista','Tu lista está vacía'); break;
  }
  c.scrollTop = 0;
  // default focus: first row of content if it exists, else rail
  requestAnimationFrame(()=>{
    const firstNavEl = c.querySelector('[data-tv-nav]');
    if (firstNavEl) tvSetFocus(firstNavEl.dataset.row, 0);
    else tvSetFocus('rail', railColFor(section));
  });
}

function railColFor(section){
  const el = document.querySelector(`.tv-rail-item[data-section="${section}"]`);
  return el ? +el.dataset.col : 0;
}

        <div class="tv-hero-buttons">

    </div>`;
  }
  const destacados = allContent.slice(5,15);
  const peliculas = allContent.filter(i=>i.tipo==='pelicula').slice(0,10);
  const series = allContent.filter(i=>i.tipo==='serie').slice(0,10);

  c.innerHTML = html;

/* --- TV spatial (D-pad) navigation engine --- */
function tvAllFocusable(){ return Array.from(document.querySelectorAll('.app#appTV.active [data-tv-nav]')).filter(el=>el.offsetParent !== null); }
function tvGroupsByRow(){
  const groups = {};
  tvAllFocusable().forEach(el=>{
    const row = el.dataset.row;
    (groups[row] = groups[row] || []).push(el);
  });
  Object.values(groups).forEach(arr=>arr.sort((a,b)=>+a.dataset.col - +b.dataset.col));
  return groups;
}
function tvRowOrder(){
  // Order visible rows top-to-bottom based on DOM position (rail excluded from vertical flow when content focused)
  const groups = tvGroupsByRow();
  const rows = Object.keys(groups).filter(r=>r!=='rail');
  rows.sort((a,b)=>{
    const ea = groups[a][0], eb = groups[b][0];
    return ea.getBoundingClientRect().top - eb.getBoundingClientRect().top;
  });
  return rows;
}

function tvSetFocus(row, col){
  const groups = tvGroupsByRow();
  let list = groups[row];
  if (!list || !list.length){ row = 'rail'; col = 0; list = groups['rail']; }
  if (!list) return;
  col = Math.max(0, Math.min(col, list.length-1));
  document.querySelectorAll('.tv-focused').forEach(el=>el.classList.remove('tv-focused'));
  const target = list[col];
  target.classList.add('tv-focused');
  target.scrollIntoView({ block:'nearest', inline:'nearest', behavior:'smooth' });
  document.getElementById('tvRail').classList.toggle('expanded', row === 'rail');
  tvFocusRow = row; tvFocusCol = col;
}

function tvMove(dir){
  const groups = tvGroupsByRow();
  const curList = groups[tvFocusRow] || [];
  if (dir === 'left'){
    if (tvFocusCol > 0) tvSetFocus(tvFocusRow, tvFocusCol-1);
    else if (tvFocusRow !== 'rail' && tvContext === 'home') tvSetFocus('rail', railColFor(tvCurrentSection));
    return;
  }
  if (dir === 'right'){
    if (tvFocusCol < curList.length-1) tvSetFocus(tvFocusRow, tvFocusCol+1);
    return;
  }
  if (tvContext === 'search'){
    const order = ['search-input','search-filters','search-results'];
    const idx = order.indexOf(tvFocusRow);
    if (dir === 'down' && idx < order.length-1) tvSetFocus(order[idx+1], 0);
    if (dir === 'up' && idx > 0) tvSetFocus(order[idx-1], 0);
    return;
  }
  if (tvFocusRow === 'rail'){
    if (dir === 'down' && tvFocusCol < curList.length-1) tvSetFocus('rail', tvFocusCol+1);
    if (dir === 'up' && tvFocusCol > 0) tvSetFocus('rail', tvFocusCol-1);
    if (dir === 'right') { const order = tvHomeContentOrder(); if (order.length) tvSetFocus(order[0], 0); }
    return;
  }
  const order = tvHomeContentOrder();
  const idx = order.indexOf(tvFocusRow);
  if (dir === 'down' && idx < order.length-1) tvSetFocus(order[idx+1], tvFocusCol);
  if (dir === 'up'){
    if (idx > 0) tvSetFocus(order[idx-1], tvFocusCol);
    else tvSetFocus('rail', railColFor(tvCurrentSection));
  }
}
function tvHomeContentOrder(){
  const order = [];
  if (document.getElementById('tvHero')) order.push('hero');
  order.push(...tvRowOrder());
  return order;
}

document.addEventListener('keydown', (e)=>{
  if (deviceMode !== 'tv' || !document.getElementById('appTV').classList.contains('active')) return;
  const key = e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' ','Escape','Backspace'].includes(key)) e.preventDefault();

  if (key === 'Escape' || key === 'Backspace'){
    if (document.getElementById('tvPlayerOverlay').classList.contains('active')) tvClosePlayer();
    else if (document.getElementById('tvSearchScreen').classList.contains('active')) tvShowSection('home');
    return;
  }
  if (key === 'Enter' || key === ' '){
    const focused = document.querySelector('.tv-focused');
    if (focused) focused.click();
    return;
  }
  const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
  if (map[key]) tvMove(map[key]);
});
